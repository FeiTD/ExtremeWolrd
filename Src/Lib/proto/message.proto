syntax = "proto3";

package SkillBridge.Message;

option csharp_namespace = "SkillBridge.Message";
option cc_enable_arenas = true;

////////////////////////////////////////////////////////////////
//
//  Basic Defines
//
////////////////////////////////////////////////////////////////
enum RESULT
{
	SUCCESS = 0;
	FAILED = 1;
}

enum CHARACTER_TYPE
{
	Player = 0;
	NPC = 1;
	Monster = 2;
}

enum CHARACTER_CLASS
{
	NONE = 0;
	WARRIOR = 1;
	WIZARD = 2;
	ARCHER = 3;
}

enum CHARACTER_STATE
{
	IDLE = 0;
	MOVE = 1;
}

enum ENTITY_EVENT
{
	NONE = 0;
	IDLE = 1;
	MOVE_FWD = 2;
	MOVE_BACK = 3;
	JUMP = 4;
}

enum ITEM_TYPE{
	NORMAL = 0;
	MATERIAL = 1;
	TASK = 2; //任务道具
	EQUIP = 3;
	RIDE = 4;
}


enum STATUS_ACTION{
	UPDATE = 0;
	ADD = 1;
	DELETE = 2;
}

enum STATUS_TYPE{
	MONEY = 0;
	EXP = 1;
	SKILL_POINT = 2;
	ITEM = 3;
}

enum STATUS_SOURCE{
	UPDATE = 0;
	ADD = 1;
	DELETE = 2;
}

enum EQUIP_SLOT{
	WEAPON = 0;
	ACCESSORY =1;
	HELMET = 2;//头盔
	CHEST = 3;//胸甲
	SHOULDER = 4;//护肩
	PANTS = 5;//裤子
	BOOTS = 6;//靴子
	SLOT_MAX = 7;
}

enum QUEST_STATUS{
	IN_PROGRESS = 0;//已接受、未完成
	COMPLATED = 1;//已完成、未提交
	FINISHED = 2;//已完成
	FAILED = 3;//已失败
}

enum QUEST_LIST_TYPE{
	ALL = 0;
	IN_PROGRESS = 1;
	FINISHED = 2;
}

enum APPLY_RESULT{
	NONE = 0;
	ACCEPT = 1;
	REJECT = 2;
}

enum GUILD_TITLE{
	NONE = 0;
	PRESIDENT = 1;
	VICE_PRESIDENT = 2;
}

enum GUILD_ADMIN_COMMAND{
	KICKOUT = 1;
	PROMOTE = 2;
	DEPOST = 3;
	TRANSFER = 4;
}

message NStatus{
	STATUS_TYPE type = 1;
	STATUS_ACTION action = 2;
	int32 id = 3;
	int32 value = 4;
}

message StatusNotify{
	repeated NStatus status = 1;
}

message NUserInfo {
	int32 id = 1;
	NPlayerInfo player = 2;
}

message NPlayerInfo {
	int32 id = 1;
	repeated NCharacterInfo characters = 2;
}

message NCharacterInfo {
	int32 id = 1;
	int32 tid = 2;
	string name = 3;
	CHARACTER_TYPE type = 4;
	CHARACTER_CLASS class = 5;
	int32 level = 6;
	int32 mapId = 7;
	NEntity entity = 8;
	int32 EntityId = 9;
	int32 ConfigId = 10;

	repeated NItemInfo Items = 11; //道具数组
	NBagInfo Bag = 12;//背包

	int64 Gold = 13;//金币
	bytes Equips = 14;//装备

	repeated NQuestInfo quests = 15;//任务
	repeated NFriendInfo friends = 16;

	//NGuildInfo guild = 17;
}

message NItemInfo{
	int32 id = 1;
	int32 count = 2;
}

message NBagInfo{
	int32 Unlocked = 1;
	bytes Items = 2;
}
message NVector3
{
	int32 x = 1;
	int32 y = 2;
	int32 z = 3;
}

message NQuestInfo{
	int32 quest_id = 1;
	int32 quest_guid = 2;
	QUEST_STATUS status = 3;
	repeated int32 targets = 4;
}

message NFriendInfo
{
	int32 id = 1;
	NCharacterInfo friendInfo = 2;
	int32 status = 3;
}

message NTeamInfo{
	int32 team_id = 1;
	int32 leader = 2;
	repeated NCharacterInfo members = 3;
}

message NGuildInfo{
	int32 id = 1;
	string guild_name = 2;
	int32 leader_id = 3;
	string leaderName = 4;
	string notice = 5;
	int32 memberCount = 6;
	repeated NGuildMemberInfo members = 7;
	repeated NGuildApplyInfo applies = 8;
	int64 creatTime = 9;
}

message NGuildMemberInfo{
	int32 id = 1;
	int32 characterId = 2;
	GUILD_TITLE title = 3;
	NCharacterInfo info = 4;
	int64 joinTime = 5;
	int64 lastTime = 6;
	int32 status = 7;
}

message NGuildApplyInfo{
	int32 guiId = 1;
	int32 characterId = 2;
	string name = 3;
	int32 class = 4;
	int32 level = 5;
	APPLY_RESULT result = 6;
}

////////////////////////////////////////////////////////////////
//
//  Entities
//
////////////////////////////////////////////////////////////////


message NEntity {
	int32 id = 1;
	NVector3 position = 2;
	NVector3 direction = 3;
	int32 speed = 4;
}

message NEntitySync {
	int32 id = 1;
	ENTITY_EVENT event = 2;
	NEntity entity = 3;
	
}



////////////////////////////////////////////////////////////////
//
//  Messages
//
////////////////////////////////////////////////////////////////

message NetMessage{
	NetMessageRequest Request = 1;
	NetMessageResponse Response = 2;
}

message NetMessageRequest{
	UserRegisterRequest userRegister = 1;
	UserLoginRequest userLogin = 2;
	UserCreateCharacterRequest createChar = 3;
	UserGameEnterRequest gameEnter = 4;
	UserGameLeaveRequest gameLeave = 5;
	
	MapCharacterEnterRequest mapCharacterEnter = 6;

	MapEntitySyncRequest mapEntitySync = 8;
	MapTeleportRequest mapTeleport = 9;

	ItemBuyRequest itemBuy = 10;
	ItemEquipRequest itemEquip = 11;

	QuestAcceptRequest questAccept = 12;
	QuestSubmitRequest questSubmit = 13;

	
	FriendAddRequest friendAddReq = 14;
	FriendListRequest friendList = 15;
	FriendRemoveRequest friendRemove = 16;
	FriendAddResponse friendAddRes = 17;

	TeamLeaveRequest teamLeave = 18;
	TeamInviteRequest teamInviteReq = 19;
	TeamInfoRequest teamInfo = 20;
	TeamInviteResponse teamInviteRes = 21;

	GuildCreateRequest guildcreat = 22;
	GuildRequest guild = 23;
	GuildJoinRequest gulidJoinReq = 24;
	GuildJoinResponse guildJoinRes = 25;
	GuildLeaveRequest guildLeave = 26;
	GuildListRequest guildList = 27;
	GuildAdminRequest guildAdmin = 28;
}

message NetMessageResponse{
	UserRegisterResponse userRegister = 1;
	UserLoginResponse userLogin = 2;
	UserCreateCharacterResponse createChar = 3;
	UserGameEnterResponse gameEnter = 4;
	UserGameLeaveResponse gameLeave = 5;

	MapCharacterEnterResponse mapCharacterEnter = 6;
	MapCharacterLeaveResponse mapCharacterLeave = 7;

	MapEntitySyncResponse mapEntitySync = 8;
	ItemBuyResponse itemBuy = 9;
	StatusNotify statusNotify = 10;
	ItemEquipResopnse itemEquip = 11;
	
	QuestAcceptResponse questAccept = 12;
	QuestSubmitResponse questSubmit = 13;

	FriendAddResponse friendAddRes = 14;
	FriendListResponse friendList = 15;
	FriendRemoveResponse friendRemove = 16;
	FriendAddRequest friendAddReq = 17;
	TeamLeaveResponse teamLeave = 18;
	TeamInviteResponse teamInviteRes = 19;
	TeamInfoResponse teamInfo = 20;
	TeamInviteRequest teamInviteReq = 21;

	GuildCreateResponse guildcreat = 22;
	GuildResponse guild = 23;
	GuildJoinRequest gulidJoinReq = 24;
	GuildJoinResponse guildJoinRes = 25;
	GuildLeaveResponse guildLeave = 26;
	GuildListResponse guildList = 27;
	GuildAdminResponse guildAdmin = 28;
}


// User Protocol
message UserLoginRequest {
	string user = 1;
	string passward = 2;
}

message UserLoginResponse {
	RESULT result = 1;
	string errormsg = 2;
	NUserInfo userinfo = 3;
}


message UserRegisterRequest
{
	string user = 1;
	string passward = 2;
}

message UserRegisterResponse {
	RESULT result = 1;
	string errormsg = 2;
	NCharacterInfo character = 3;
}

message UserCreateCharacterRequest
{
	string name = 1;
	CHARACTER_CLASS class = 2;
}

message UserCreateCharacterResponse {
	RESULT result = 1;
	string errormsg = 2;
	repeated NCharacterInfo characters = 3;
}

message UserGameEnterRequest
{
	int32 characterIdx = 1;
}

message UserGameEnterResponse {
	RESULT result = 1;
	string errormsg = 2;
	NCharacterInfo Character = 3;
}

message UserGameLeaveRequest
{
}

message UserGameLeaveResponse {
	RESULT result = 1;
	string errormsg = 2;
}

// Map Protocol
message MapCharacterEnterRequest
{
	int32 mapId = 1;
}

message MapCharacterEnterResponse
{
	int32 mapId = 1;
	repeated NCharacterInfo characters = 2;
}

message MapCharacterLeaveResponse
{
	int32 characterId = 1;
	int32 entityId = 2;
}


message MapEntitySyncRequest
{
    NEntitySync entitySync = 1;
}


message MapEntitySyncResponse
{
    repeated NEntitySync entitySyncs = 2;
}

message MapTeleportRequest
{
	int32 teleporterId = 1;
}

//请求保存背包
message BagSaveRequest{
	NBagInfo BagInfo = 1;
}

message BagSaveResponse{
	RESULT result = 1;
	string errormsg = 2;
}

message ItemBuyRequest
{
	int32 shopId = 1;
	int32 shopItemId = 2;
}

message ItemBuyResponse
{
	RESULT result = 1;
	string errormsg = 2;
}

message ItemEquipRequest{
	int32 slot = 1;
	int32 itemId = 2;
    bool isEquip = 3;
}

message ItemEquipResopnse{
	RESULT result = 1;
	string errormsg = 2;
}

message QuestListRequest{
	QUEST_LIST_TYPE listType = 1;
}

message QuestListResponse{
	RESULT result = 1;
	string errormsg = 2;
	repeated NQuestInfo quests = 3;
}

message QuestAcceptRequest{
	int32 quest_id = 1;
}

message QuestAcceptResponse{
	RESULT result = 1;
	string errormsg = 2;
	NQuestInfo quest = 3;
}

message QuestSubmitRequest{
	int32 quest_id = 1;
}

message QuestSubmitResponse{
	RESULT result = 1;
	string errormsg = 2;
	NQuestInfo quest = 3;
}

message FriendAddRequest
{
	int32 from_id = 1;
	string from_name = 2;
	int32 to_id = 3;
	string to_name = 4;
}

message FriendAddResponse
{
	RESULT result = 1;
	string errormsg = 2;
	FriendAddRequest request = 3;
}

message FriendListRequest
{

}

message FriendListResponse
{
	RESULT result = 1;
	string errormsg = 2;
	repeated NFriendInfo friends = 3;
}

message FriendRemoveRequest
{
	int32 id = 1;
	int32 friendId = 2;
}

message FriendRemoveResponse
{
	RESULT result = 1;
	string errormsg = 2;
	int32 id = 3;
}

message TeamInviteRequest{
	int32 from_id = 1;
	string from_name = 2;
	int32 to_id = 3;
	string to_name = 4;
}

message TeamInviteResponse{
	RESULT result = 1;
	string errormsg = 2;
	TeamInviteRequest request = 3;
}

message TeamInfoRequest{

}

message TeamInfoResponse{
	RESULT result = 1;
	string errormsg = 2;
	NTeamInfo team = 3;
}

message TeamLeaveRequest{
	int32 team_id = 1;
	int32 character_id = 2;
}

message TeamLeaveResponse{
	RESULT result = 1;
	string errormsg = 2;
	int32 characterId = 3;
}

message GuildCreateRequest{
	string guild_name = 1;
	string guild_notice = 2;
}

message GuildCreateResponse{
	RESULT result = 1;
	string errormsg = 2;
	NGuildInfo guildinfo = 3;
}



message GuildListRequest{

}

message GuildListResponse{
	RESULT result = 1;
	string errormsg = 2;
	repeated NGuildInfo guilds = 3;
}

message GuildRequest{

}

message GuildResponse{
	RESULT result = 1;
	string errormsg = 2;
	NGuildInfo guildinfo = 3;
}

message GuildLeaveRequest{

}

message GuildLeaveResponse{
	RESULT result = 1;
	string errormsg = 2;
}

message GuildJoinRequest{
	NGuildApplyInfo apply = 1;
}

message GuildJoinResponse{
	RESULT result = 1;
	string errormsg = 2;
	NGuildApplyInfo apply = 3;
}

message GuildAdminRequest{
	GUILD_ADMIN_COMMAND command = 1;
	int32 target = 2;
}

message GuildAdminResponse{
	RESULT result = 1;
	string errormsg = 2;
	GuildAdminRequest command = 3;
}